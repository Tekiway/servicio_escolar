# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

name: servicio_escolar

services:
  alumno-service:
    build: ./servicio_alumnos
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    volumes:
      - ./servicio_alumnos:/app
      - /app/node_modules
    environment:
      MONGO_URI: mongodb://mongo-alumnos:27017/alumnos_db
      PORT: 3001
      JWT_SECRET: secreto
      DOCENTES_URL: http://docente-service:3002
    develop:
      watch:
        - action: sync
          path: ./servicio_alumnos
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./servicio_alumnos/package.json
        - action: rebuild
          path: ./servicio_alumnos/package-lock.json
    depends_on:
      - mongo-alumnos

  docente-service:
    build:
      context: ./servicio_docente
      dockerfile: dockerfile
    command: sh -c "npm install && npm run dev"
    ports:
      - "3002:3002"
    volumes:
      - ./servicio_docente:/app
      - /app/node_modules
    environment:
      MONGO_URI: mongodb://mongo-docentes:27017/docentes_db
      PORT: 3002
      JWT_SECRET: secreto
      ALUMNOS_URL: http://alumno-service:3001
    develop:
      watch:
        - action: sync
          path: ./servicio_docente
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./servicio_docente/package.json
        - action: rebuild
          path: ./servicio_docente/package-lock.json
    depends_on:
      - mongo-docentes

  directivo-service:
    build: ./servicio_directivo
    command: sh -c "npm install && npm run dev"
    ports:
      - "3003:3003"
    volumes:
      - ./servicio_directivo:/app
      - /app/node_modules
    environment:
      MONGO_URI: mongodb://mongo-directivos:27017/directivos_db
      PORT: 3003
      JWT_SECRET: secreto
    develop:
      watch:
        - action: sync
          path: ./servicio_directivo
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./servicio_directivo/package.json
        - action: rebuild
          path: ./servicio_directivo/package-lock.json
    depends_on:
      - mongo-directivos

  finance-service:
    build: ./servicio_finanzas
    command: sh -c "npm install && npm run dev"
    ports:
      - "3004:3004"
    volumes:
      - ./servicio_finanzas:/app
      - /app/node_modules
    environment:
      MONGO_URI: mongodb://mongo-finanzas:27017/finanzas_db
      PORT: 3004
      JWT_SECRET: secreto
    develop:
      watch:
        - action: sync
          path: ./servicio_finanzas
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./servicio_finanzas/package.json
        - action: rebuild
          path: ./servicio_finanzas/package-lock.json
    depends_on:
      - mongo-finanzas

  frontend-service:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/html
    depends_on:
      - alumno-service
      - docente-service
      - directivo-service
      - finance-service

  mongo-alumnos:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-alumnos-data:/data/db

  mongo-docentes:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo-docentes-data:/data/db

  mongo-directivos:
    image: mongo:latest
    ports:
      - "27019:27017"
    volumes:
      - mongo-directivos-data:/data/db

  mongo-finanzas:
    image: mongo:latest
    ports:
      - "27020:27017"
    volumes:
      - mongo-finanzas-data:/data/db

volumes:
  mongo-alumnos-data:
  mongo-docentes-data:
  mongo-directivos-data:
  mongo-finanzas-data:
  